[workspace]
resolver = "3"
members = ["crates/kv-core", "crates/kv"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DFanso/key-vault-for-llm"
homepage = "https://github.com/DFanso/key-vault-for-llm"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
