# Weekly Cargo updates, grouped into one pull request. A release must be at
# least 7 days old before it is proposed, so a bad or malicious publish has
# time to be yanked first.
#
# GitHub Actions are not updated here: release.yml is generated by
# cargo-dist from dist-workspace.toml, so its pins move with dist.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
