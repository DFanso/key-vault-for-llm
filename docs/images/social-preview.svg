    <stop offset="0" stop-color="#6e40c9" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="640" fill="#0d1117"/>
<rect width="1280" height="640" fill="url(#glow)"/>

<g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <text x="80" y="128" fill="#8b949e" font-size="26" font-family="ui-monospace, Consolas, Menlo, monospace">DFanso / key-vault-for-llm</text>
  <text x="80" y="210" fill="#f0f6fc" font-size="64" font-weight="700">Let AI agents use your secrets</text>
  <text x="80" y="284" fill="#f0f6fc" font-size="64" font-weight="700">without <tspan fill="#d29922">ever seeing them.</tspan></text>
  <text x="80" y="340" fill="#c9d1d9" font-size="28">A local secrets broker and MCP server for Claude Code, Cursor and other coding agents.</text>
