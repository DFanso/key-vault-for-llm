<g font-family="ui-monospace, Consolas, Menlo, monospace" font-size="22">
  <rect x="80" y="380" width="1120" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="106" cy="404" r="7" fill="#ff5f57"/>
  <circle cx="130" cy="404" r="7" fill="#febc2e"/>
  <circle cx="154" cy="404" r="7" fill="#28c840"/>
  <text x="104" y="452" fill="#6e7681">agent</text>
  <text x="190" y="452" fill="#c9d1d9">http_request(handle: <tspan fill="#a5d6ff">"openrouter"</tspan>, path: <tspan fill="#a5d6ff">"/api/v1/models"</tspan>)</text>
  <text x="104" y="496" fill="#6e7681">kv</text>
  <text x="190" y="496" fill="#3fb950">200 OK</text>
  <text x="290" y="496" fill="#c9d1d9">Authorization: Bearer <tspan fill="#d29922" font-weight="700">[kv:openrouter]</tspan></text>
