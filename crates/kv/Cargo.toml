[package]
name = "kv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local secrets broker that lets AI agents use secrets without seeing them"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7.0"
humantime = "2"
kv-core = { path = "../kv-core" }
notify-rust = "4.18"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.5", default-features = false, features = ["macros", "server", "transport-io"] }
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "0.14"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.27"
tokio-rustls = "0.26"
wiremock = "0.6"
