[package]
name = "kv"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local secrets broker and MCP server that lets AI agents use secrets without seeing them"
readme = "../../README.md"
keywords = ["mcp", "secrets", "ai-agents", "llm", "vault"]
categories = ["command-line-utilities", "cryptography", "authentication", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7.0"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
humantime = "2"
kv-core = { path = "../kv-core" }
notify-rust = "4.18"
percent-encoding = "2.3"
postgres-protocol = "0.6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.5", default-features = false, features = ["macros", "server", "transport-io"] }
rpassword = "7.5"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false }
url = "2.5"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
security-framework = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
hkdf = "0.13"
sha2 = "0.11"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rcgen = "0.14"
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.27"
tokio-rustls = "0.26"
wiremock = "0.6"
