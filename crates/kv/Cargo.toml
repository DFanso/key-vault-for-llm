[package]
name = "kv"
version = "1.9.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local secrets broker and MCP server that lets AI agents use secrets without seeing them"
readme = "../../README.md"
keywords = ["mcp", "secrets", "ai-agents", "llm", "vault"]
categories = ["command-line-utilities", "cryptography", "authentication", "development-tools"]

[features]
# Set by the release build (see dist-workspace.toml). Only such builds
# update themselves; `cargo install --path` and source builds never do.
release-build = []

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
base64 = "0.23"
dirs = "7.0"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
humantime = "2"
kv-core = { path = "../kv-core" }
notify-rust = "4.18"
percent-encoding = "2.3"
postgres-protocol = "0.6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.9", default-features = false, features = ["macros", "server", "transport-io", "client"] }
rpassword = "7.5"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The work folder an update downloads into, removed whatever happens.
tempfile = "3.27"
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false }
url = "2.5"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSError", "NSSet", "NSString", "NSURL"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
# Notifications with buttons to answer a request, once kv tray runs from
# kv.app. No default features: they pull in Core Location.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
png = "0.18"
security-framework = "3"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = "0.37"
tray-icon = "0.26"
# kv's window. No default features: they are Linux's, and `devtools` stays
# off.
wry = { version = "0.57", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# fork for the daemon's listener process (see ipc::bind_with_listener_process).
libc = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }
# Release archives on unix are `.tar.xz`; both readers are pure Rust and
# stream, so memory stays small however the archive is crafted.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
# The Windows release archive is a `.zip`: deflate only, pure Rust.
zip = { version = "9.6", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a backend chosen; this is the pure-Rust one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hkdf = "0.13"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rcgen = "0.14"
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
tokio-rustls = "0.26"
wiremock = "0.6"

[target.'cfg(unix)'.dev-dependencies]
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
zip = { version = "9.6", default-features = false, features = ["deflate-flate2"] }
