[package]
name = "kv-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vault, policy and output scrubbing for the kv secrets broker"

[dependencies]
aho-corasick = "1.1"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hex = "0.4"
humantime-serde = "1.1"
percent-encoding = "2.3"
region = "4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
proptest = "1.11"
tempfile = "3.27"
